name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: bash -n plugins/notify_by_pushover.sh
      - run: python -m py_compile plugins/notify-lametric.py
      - run: python -m unittest discover -s tests -v
